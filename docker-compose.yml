name: hypergrid

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: hg-postgres
    restart: always
    environment:
      POSTGRES_DB: ${PG_DATABASE:-hg-database}
      POSTGRES_USER: ${PG_USER:-root}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-1234567890}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-root} -d ${PG_DATABASE:-hg-database}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hg-network

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: hg-server
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${PG_USER:-root}:${PG_PASSWORD:-1234567890}@postgres:5432/${PG_DATABASE:-hg-database}?schema=public
      BASE_URL: ${BASE_URL:-http://localhost:4000}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-HZoiFLO3/hmi5kHMu7C8Lg==}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:4000}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "4000:4000"
    networks:
      - hg-network

  app:
    build:
      context: .
      dockerfile: apps/app/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    container_name: hg-app
    restart: always
    depends_on:
      - server
    environment:
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    networks:
      - hg-network

volumes:
  postgres_data:
    driver: local

networks:
  hg-network:
    driver: bridge
